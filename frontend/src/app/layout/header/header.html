<header class="relative mx-auto max-w-360">
  <div class="flex items-center gap-8 rounded-card border border-border bg-surface py-2 pr-2 pl-4">
    <a
      class="flex flex-1 rounded-control focus-ring"
      [routerLink]="paths.calculator"
      aria-label="Калькулятор — на головну"
    >
      <img class="block" src="intobi-logo.svg" alt="" width="151" height="32" />
    </a>

    @if (loggedIn()) {
      <nav
        id="site-nav"
        class="max-nav:absolute max-nav:inset-x-0 max-nav:top-[calc(100%+0.5rem)] max-nav:z-10 max-nav:hidden max-nav:max-h-[calc(100vh-6rem)] max-nav:overflow-y-auto max-nav:rounded-card max-nav:border max-nav:border-border max-nav:bg-surface max-nav:p-4 max-nav:shadow-popover max-nav:data-[open=true]:block"
        aria-label="Меню калькулятора"
        [attr.data-open]="mobileOpen()"
      >
        <ul class="m-0 list-none p-0 nav:flex nav:items-center nav:gap-6">
          @for (link of links; track link.path) {
            <li>
              <a
                class="inline-flex items-center py-3 leading-tight font-semibold whitespace-nowrap text-title no-underline focus-ring transition-colors hover:text-outline aria-[current=page]:text-outline max-nav:w-full"
                [routerLink]="link.path"
                routerLinkActive
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
              >
                {{ link.label }}
              </a>
            </li>
          }
          <li class="nav:relative">
            <button
              type="button"
              class="group inline-flex cursor-pointer items-center gap-2 border-0 bg-transparent py-3 text-base leading-tight font-semibold whitespace-nowrap text-title focus-ring transition-colors hover:text-outline max-nav:w-full max-nav:justify-between"
              aria-controls="submenu-shortcuts"
              [attr.aria-expanded]="openMenu() === 'shortcuts'"
              (click)="toggleMenu('shortcuts')"
            >
              Гарячі клавіші
              <img
                class="transition-transform group-aria-expanded:rotate-180"
                src="chevron-down.svg"
                alt=""
                width="24"
                height="24"
              />
            </button>
            <dl
              id="submenu-shortcuts"
              class="m-0 grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 p-4 text-sm max-nav:pt-0 nav:absolute nav:top-[calc(100%+0.5rem)] nav:-left-4 nav:z-10 nav:w-80 nav:rounded-control nav:border nav:border-border nav:bg-surface nav:shadow-popover"
              [hidden]="openMenu() !== 'shortcuts'"
            >
              @for (shortcut of shortcuts; track shortcut.action) {
                <dt class="flex flex-wrap gap-1">
                  @for (key of shortcut.keys; track key) {
                    <kbd
                      class="rounded-md border border-field-border bg-field-bg px-1.5 py-0.5 font-sans text-xs font-semibold text-title"
                      >{{ key }}</kbd
                    >
                  }
                </dt>
                <dd class="m-0 self-center text-text">{{ shortcut.action }}</dd>
              }
            </dl>
          </li>
          <li class="mt-3 border-t border-border pt-3 nav:hidden">
            <p class="m-0 truncate text-sm text-muted">{{ email() }}</p>
            <button
              type="button"
              class="mt-3 cursor-pointer rounded-control border border-outline bg-transparent px-5 py-3 leading-tight font-semibold text-outline focus-ring transition-colors hover:bg-outline-hover"
              (click)="logout()"
            >
              Вийти
            </button>
          </li>
        </ul>
      </nav>

      <div class="relative flex flex-1 justify-end max-nav:hidden">
        <button
          type="button"
          class="group inline-flex max-w-72 cursor-pointer items-center gap-2 rounded-control border border-outline bg-transparent py-3 pr-3 pl-5 leading-tight font-semibold text-outline focus-ring transition-colors hover:bg-outline-hover"
          aria-controls="submenu-account"
          [attr.aria-expanded]="openMenu() === 'account'"
          (click)="toggleMenu('account')"
        >
          <span class="truncate">{{ email() }}</span>
          <img
            class="transition-transform group-aria-expanded:rotate-180"
            src="chevron-down.svg"
            alt=""
            width="24"
            height="24"
          />
        </button>
        <ul
          id="submenu-account"
          class="absolute top-[calc(100%+0.5rem)] right-0 z-10 m-0 min-w-48 list-none rounded-control border border-border bg-surface p-2 shadow-popover"
          [hidden]="openMenu() !== 'account'"
        >
          <li>
            <button
              type="button"
              class="w-full cursor-pointer rounded-control border-0 bg-transparent px-3 py-2 text-left text-base text-text focus-ring transition-colors hover:bg-field-bg hover:text-title"
              (click)="logout()"
            >
              Вийти
            </button>
          </li>
        </ul>
      </div>

      <button
        type="button"
        class="group flex size-12 cursor-pointer flex-col justify-center gap-1.25 rounded-control border-0 bg-field-bg px-3 focus-ring nav:hidden"
        aria-controls="site-nav"
        aria-label="Меню"
        [attr.aria-expanded]="mobileOpen()"
        (click)="toggleMobile()"
      >
        @for (line of burgerLines; track $index) {
          <span
            class="block h-0.5 rounded-full bg-title transition-[transform,opacity]"
            [class]="line"
          ></span>
        }
      </button>
    } @else {
      <a
        class="inline-flex items-center rounded-control border border-outline px-5 py-3.5 leading-tight font-semibold whitespace-nowrap text-outline no-underline focus-ring transition-colors hover:bg-outline-hover"
        [routerLink]="paths.login"
      >
        Увійти
      </a>
    }
  </div>
</header>
