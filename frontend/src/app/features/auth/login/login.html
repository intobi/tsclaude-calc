<h1 class="m-0 text-center font-title text-[2rem] leading-tight font-normal text-title">
  Sign <span class="title-accent">In</span>
</h1>
<form
  class="flex w-full max-w-92 flex-col gap-4 rounded-card border border-border bg-surface p-8"
  (ngSubmit)="submit()"
>
  @if (passwordChanged()) {
    <div class="text-sm text-success" role="status">
      Your password has been changed. Sign in with the new password.
    </div>
  }
  @for (field of fields; track field.name) {
    <label class="flex flex-col gap-2 text-sm text-muted">
      {{ field.label }}
      <input
        class="rounded-control border border-field-border bg-field-bg px-4 py-3 text-base text-title focus-ring transition-colors hover:bg-field-hover"
        [type]="field.type"
        [name]="field.name"
        [autocomplete]="field.autocomplete"
        [(ngModel)]="credentials[field.name]"
        required
      />
    </label>
  }
  @if (error()) {
    <div class="text-sm text-error" role="alert">{{ error() }}</div>
  }
  <div class="flex flex-wrap items-center justify-between gap-4">
    <button type="submit" class="btn-primary px-6 py-3" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
    <a
      class="rounded-control text-sm font-semibold text-outline no-underline focus-ring hover:underline"
      [routerLink]="forgotPasswordPath"
      [queryParams]="{ email: credentials.email || null }"
      >Forgot password?</a
    >
  </div>
</form>
