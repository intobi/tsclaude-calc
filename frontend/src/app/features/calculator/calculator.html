<h1 class="m-0 text-center font-title text-[2rem] leading-tight font-normal text-title">
  Super <span class="title-accent">Calculator</span>
</h1>
<div class="flex w-full max-w-92 flex-col gap-3">
  <div class="flex justify-end">
    <a class="btn-outline px-4 py-2 text-sm" [routerLink]="viewToggle().path">
      <span aria-hidden="true">⇄</span>
      {{ viewToggle().label }}
    </a>
  </div>
  <div class="w-full perspective-[75rem]">
    <div
      class="relative transition-transform duration-800 ease-flip transform-3d"
      [class.rotate-y-180]="historyOpen()"
    >
      <section
        #keypad
        class="rounded-card border border-border bg-surface p-8 backface-hidden"
        aria-label="Calculator"
        [attr.aria-busy]="busy()"
        [attr.inert]="historyOpen() ? '' : null"
      >
        <div class="min-h-27.5 px-2 pb-4 text-right" role="status" aria-live="polite">
          <div class="min-h-6 text-base text-muted">{{ expression() }}</div>
          <output class="block truncate font-title text-[2.75rem] leading-tight text-title">
            {{ display() }}
          </output>
          @if (error()) {
            <div class="text-sm text-error" role="alert">{{ error() }}</div>
          }
        </div>
        <div class="grid grid-cols-4 gap-2">
          @for (key of keys; track key.label) {
            <button
              type="button"
              class="cursor-pointer rounded-control border text-[1.375rem] font-medium focus-ring transition-[background-color,border-color,transform] active:scale-94 data-[pressed=true]:scale-94"
              [class]="keyClasses(key)"
              [attr.data-pressed]="pressedKey() === key"
              [attr.aria-label]="key.ariaLabel ?? null"
              [attr.aria-keyshortcuts]="key.shortcuts.join(' ')"
              (click)="onKey(key)"
            >
              {{ key.label }}
            </button>
          }
        </div>
      </section>
      <app-history
        class="absolute inset-0 rotate-y-180 backface-hidden"
        [attr.inert]="historyOpen() ? null : ''"
        [active]="historyOpen()"
      />
    </div>
  </div>
</div>
